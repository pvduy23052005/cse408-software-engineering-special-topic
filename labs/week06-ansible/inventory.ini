# TỆP DANH MỤC MÁY CHỦ ANSIBLE - BÀI THỰC HÀNH TUẦN 6
# Cấu hình 2 khóa SSH độc lập cho từng máy (Separation of Keys)
# Sinh viên thực hiện: Phùng Văn Duy - MSSV: 2352270589
# ==============================================================================

[app_servers]
prod-vm ansible_host=192.168.252.4 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/github_deploy_key

[db_servers]
db-server ansible_host=192.168.252.5 ansible_user=user-db ansible_ssh_private_key_file=~/.ssh/db-server-key

[cluster:children]
app_servers
db_servers

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
